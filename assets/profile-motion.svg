<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
<title id="title">Vansh Gurnani — Backend Developer and Applied AI</title>
<desc id="desc">Animated dark navy banner with softly pulsing network nodes and orbiting rings.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d1a"/><stop offset=".55" stop-color="#101d38"/><stop offset="1" stop-color="#142b52"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#38bdf8" stop-opacity="0"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#38bdf8" stop-opacity=".3"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="260" rx="22" fill="url(#bg)"/>
<circle cx="930" cy="130" r="150" fill="url(#glow)"><animate attributeName="opacity" values=".4;1;.4" dur="5s" repeatCount="indefinite"/></circle>
